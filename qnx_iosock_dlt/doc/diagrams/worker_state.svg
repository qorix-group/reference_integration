<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="571px" preserveAspectRatio="none" style="width:726px;height:571px;background:#FFFFFF;" version="1.1" viewBox="0 0 726 571" width="726px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="385" x="163.75" y="22.9951">Worker state (sysctl qnx.module.score_dlt.state)</text><ellipse cx="349.5" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><g id="IDLE"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="50" x="324.5" y="140.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="324.5" x2="374.5" y1="166.5938" y2="166.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="30" x="334.5" y="158.292">IDLE</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="8" x="329.5" y="182.7324">0</text></g><g id="RUNNING"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="84" x="63.5" y="267.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="63.5" x2="147.5" y1="293.5938" y2="293.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64" x="73.5" y="285.292">RUNNING</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="8" x="68.5" y="309.7324">1</text></g><g id="FINISHED"><rect fill="#F1F1F1" height="50.2656" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="83" x="7" y="429.7969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="90" y1="456.0938" y2="456.0938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text